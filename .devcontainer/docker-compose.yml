services:
  historyforge:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspaces/historyforge
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      BINDING: 0.0.0.0
      HEADLESS: "1"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    depends_on:
      db:
        condition: service_healthy
    command: sleep infinity

  db:
    image: postgres:15-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - historyforge-devcontainer-postgres15:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  historyforge-devcontainer-postgres15:
