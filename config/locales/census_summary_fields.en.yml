en:
  census_summary_fields:
    defaults:
      activity_last_week: 'The person’s main activity during the week before enumeration, such as working, keeping house, or looking for work. The question applied to people age 14 and older.'
      ag_questionnaire_no: 'This number links the household to a separate farm questionnaire, where the census collected information about the farm and its operations. The numbers identify questionnaires and have no meaning as quantities.'
      age: 'Age at the census reference date. Ages recorded in months are grouped with ages recorded in years, and each record is counted once.'
      age_married: 'The age at which a married person first married. It is distinct from their age at enumeration or the length of their current marriage.'
      attended_school: 'Whether the person attended school during the period asked about on this schedule. The reference period and who was asked varied by census year.'
      birth_month: 'The month in which the person was born. Some census years collected this only for children born within a specified period.'
      blind: 'Whether the enumerator recorded the person as blind under the census rules of the time. The category reflects historical reporting practices.'
      can_read: 'Whether the person could read in any language, as reported on the schedule.'
      can_read_write: 'Whether the person could both read and write in any language, as reported on the schedule.'
      can_speak_english: 'Whether the person was reported able to speak English. The answers do not identify every other language they spoke.'
      can_write: 'Whether the person could write in any language, as reported on the schedule.'
      cannot_read: 'Whether the schedule marked the person as unable to read. The age rules for reporting literacy depended on the census year.'
      cannot_read_write: 'Whether the schedule marked a person over age 20 as unable to read and write.'
      cannot_write: 'Whether the schedule marked the person as unable to write. The age rules for reporting literacy depended on the census year.'
      children_born: 'The number of children ever born to the woman, as reported in this supplemental question. It includes children living elsewhere or no longer living.'
      civil_war_vet: 'The schedule’s record of Civil War military service, including the side or branch of service when recorded.'
      convict: 'Whether the person was listed under the census’s historical category for people convicted of a crime.'
      county_1949: 'The county or equivalent area where the person lived one year before the 1950 census, if the supplemental residence question called for it.'
      deaf_dumb: 'Whether the enumerator recorded the person under a historical census disability category concerning deafness and speech. The original terminology reflects the period.'
      denied_citizen: 'Whether a male U.S. citizen age 21 or older was recorded as having his voting rights denied or restricted on grounds other than rebellion or another crime.'
      employed_absent: 'Whether the person had a job or business but was temporarily absent during the reference week.'
      employment: 'Whether the person worked as an employer, as an employee for wages, or on their own account, as classified on the schedule.'
      employment_code: 'A three-digit occupation code added to some 1920 census schedules, often in the margin. It groups the job the person reported with similar jobs using the census classification of the time.'
      farm_or_house: 'Whether the household lived on a place the census classified as a farm. People in the same household can share this answer even when they have different occupations.'
      farm_schedule: 'The number linking the household to a separate agricultural schedule. The number is an identifier.'
      finished_grade: 'Whether the person finished the highest grade they had attended. In 1950, enumerators asked this of eligible people whose names fell on designated lines of each census sheet, so it covers only part of the population.'
      foreign_born: 'Whether the person’s birthplace is recorded as outside the United States. Historical boundaries and place names can affect comparisons.'
      full_citizen: 'The 1870 census marked male U.S. citizens age 21 or older in a separate column from the one recording whether voting rights had been denied. This field alone cannot show whether a person was able to vote.'
      full_time_weeks: 'Weeks worked during 1939, counting part-time work as its equivalent in full-time weeks under the census instructions.'
      grade_completed: 'The highest grade of school the person had completed, including elementary, high school, and college grades.'
      had_job: 'Whether the person had a job or business from which they were temporarily absent during the 1940 employment reference week.'
      had_unearned_income: 'Whether the person received more than $50 in 1939 from sources besides money wages or salary. This could include business income, rent, or a pension. The schedule recorded whether the amount exceeded $50.'
      has_radio: 'Whether the household had a radio set. This was a household question.'
      highest_grade: 'The highest grade the person attended, even if they did not finish it. In 1950, enumerators asked this of eligible people whose names fell on designated lines of each census sheet, so it covers only part of the population.'
      home_value: 'The value of housing or real estate recorded on the schedule, in dollars at the time of the census.'
      homemaker: 'Whether the person was designated as the household’s homemaker on the schedule.'
      hours_worked: 'The number of hours the person worked during the 1950 employment reference week.'
      idiotic: 'Whether the person was listed under a historical census classification related to intellectual disability. The original category does not correspond to a modern diagnosis.'
      industry: 'The kind of business or workplace where the person worked. Two people with the same occupation could work in different industries.'
      industry_code: 'A Census Bureau code grouping the type of business or industry in which the person worked. Code definitions can differ by census year.'
      insane: 'Whether the person was listed under a historical census classification related to mental illness. The original category does not correspond to a modern diagnosis.'
      institutional_work: 'The 1940 census marked residents of certain institutions, such as prisons and homes for older people, with “Inst.” in the employment column. The enumerator left the remaining employment questions blank even if the resident had done paid work at the institution.'
      item_20_entries: 'Whether the regular 1950 questions had already recorded the person’s occupation, industry, or employment arrangement. For someone on the final sample line who had worked in 1949, this answer determined whether the enumerator needed to ask about that earlier job.'
      just_married: 'Whether the person was reported married within the year preceding the census reference date.'
      language_spoken: 'In 1910, people age 10 or older who could speak English were entered as English. For people who could not, the enumerator recorded the language they spoke, using their mother tongue if they spoke several languages.'
      last_industry: 'The industry of the person’s 1949 job. This 1950 follow-up applied on the last sample line when the person worked in 1949 and item 20 did not already contain job information.'
      last_occupation: 'The occupation at the person’s 1949 job. This 1950 follow-up applied on the last sample line when the person worked in 1949 and item 20 did not already contain job information.'
      last_worker_class: 'The worker class at the person’s 1949 job. This 1950 follow-up applied on the last sample line when the person worked in 1949 and item 20 did not already contain job information.'
      lives_on_3_acres: 'Whether the dwelling was on a place of three acres or more, as recorded by the 1950 enumerator.'
      lives_on_farm: 'Whether the residence was classified as a farm. The designation describes where the person lived.'
      maimed: 'Whether the enumerator recorded the person in the schedule’s historical category for significant physical impairment.'
      marriage_month: 'The month of marriage for a person recorded as having married during the census year.'
      mortgage: 'Whether an owned home or farm was mortgaged. The question applied to owners whose schedule called for this information.'
      mother_tongue: 'For a foreign-born person, the language they usually spoke before coming to the United States. A person could report this language even if they also spoke English.'
      mother_tongue_father: 'The usual language of the person’s foreign-born father before he came to the United States, as reported for the census.'
      mother_tongue_mother: 'The usual language of the person’s foreign-born mother before she came to the United States, as reported for the census.'
      multi_marriage: 'Whether the person reported having married more than once. Asked on the last 1950 sample line where applicable.'
      naturalized_alien: 'U.S. citizenship or naturalization status as recorded on the schedule. The categories and eligibility for the question changed between censuses.'
      nature_of_misfortune: 'A description associated with the schedule’s historical classifications for disability, institutional status, or poverty.'
      newlyweds: 'Whether the person had been married, widowed, divorced, or separated for less than a year. In 1950 this follow-up was asked only on the final sample line of each sheet, where applicable.'
      no_work_reason: 'The activity or circumstance recorded for a person outside the 1940 work and job-seeking categories, such as school or home duties.'
      num_children_alive: 'The number of the woman’s children still living at the census date, including children who lived elsewhere.'
      num_children_born: 'The number of children the woman had borne, including children who had died. The question was asked of women to whom the schedule applied.'
      occupation: 'The work the person did, as written or coded on the census. The applicable age and reference period varied by year.'
      occupation_code: 'A Census Bureau code grouping the kind of work the person performed. Compare codes using the coding scheme for each census year.'
      on_farm_1949: 'Whether the person lived on a farm one year before the 1950 census, as reported on a designated sample line.'
      own_business_family: 'Money earned in 1949 from a business, profession, or farm by the household relatives covered by the 1950 family-income question.'
      own_business_self: 'Money the person earned in 1949 from their own business, profession, or farm. Asked on designated 1950 sample lines.'
      pauper: 'A historical census category for people receiving public poor relief. The count reflects relief and reporting practices at the time and cannot measure everyone living in poverty.'
      personal_value: 'The reported dollar value of personal property, such as goods or livestock. Land and buildings were reported separately as real estate.'
      pob: 'The place of birth recorded for the person, often a state, territory, or country rather than a town.'
      pob_father: 'The place of birth reported for the person’s father, often a state, territory, or country.'
      pob_mother: 'The place of birth reported for the person’s mother, often a state, territory, or country.'
      private_hours_worked: 'Hours worked in private or non-emergency government employment during March 24–30, 1940.'
      private_work: 'Whether the person worked in private or non-emergency government employment during the 1940 reference week.'
      public_work: >-
        During the Great Depression, New Deal programs such as the Works Progress Administration (WPA),
        National Youth Administration (NYA), and Civilian Conservation Corps (CCC) provided jobs for
        people out of work. Local governments also ran work-relief programs. This field records whether a
        person age 14 or older worked on or was assigned to such a project during March 24–30, 1940.
        If they also held a private or regular government job that week, census rules determined which
        kind of work was recorded.
      race: 'The race or color category recorded under the census rules for this year. Available categories and reporting practices changed over time. Historical entries may include terms no longer in use.'
      relation_to_head: 'The person’s relationship to the household head, such as spouse, child, boarder, or employee.'
      residence_1935_county: 'The county of residence on April 1, 1935, for people whose 1940 schedule called for a previous address.'
      residence_1935_farm: 'Whether the person’s residence on April 1, 1935, was on a farm.'
      residence_1935_state: 'The state, territory, or foreign country of residence on April 1, 1935, as reported in the 1940 census.'
      residence_1935_town: 'The place of residence on April 1, 1935. The schedule could also indicate the same house or place.'
      same_county_1949: 'Whether the person lived in the same county one year before the 1950 census. Asked where applicable on designated sample lines.'
      same_house_1949: 'Whether the person lived in the same house one year before the 1950 census. Asked on designated sample lines.'
      seeking_work: 'Whether the person was looking for work during the census employment reference week.'
      sick: 'The illness or temporary disability recorded for a person who was unable to attend to their ordinary work on the day of the enumerator’s visit.'
      state_1949: 'The state, territory, or foreign country where the person lived one year before the 1950 census, if the supplemental residence question called for it.'
      unearned_income_family: 'Other money income received in 1949 by the household relatives covered by the 1950 family-income question, such as interest, pensions, or rent.'
      unearned_income_self: 'Other money income the person received in 1949, such as interest, dividends, pensions, or rent. Asked on designated 1950 sample lines.'
      unemployed: 'Whether the person was reported out of work on April 15, 1910. The schedule asked this in connection with wage or salary employment.'
      unemployed_months: 'The number of months out of work during the period specified by the schedule.'
      unemployed_weeks: 'In 1940, people looking for work or assigned to a public work-relief program were asked how many weeks had passed since their last private or regular government job of at least a month. For someone who had never held such a job, the count began when they last started looking for work.'
      veteran: 'Whether the person was reported as a veteran of U.S. military or naval service, under the census rules of that year.'
      veteran_other: 'Whether the person reported qualifying service outside the World War I and World War II periods. Asked of men on designated 1950 sample lines.'
      veteran_ww1: 'Whether the person reported military service during the World War I period defined by the census. Asked of men on designated 1950 sample lines.'
      veteran_ww2: 'Whether the person reported military service during the World War II period defined by the census. Asked of men on designated 1950 sample lines.'
      wages_or_salary: 'Money wages or salary received in 1939, in dollars. The schedule grouped amounts of $5,000 or more.'
      wages_or_salary_family: 'Money wages or salary received in 1949 by the household relatives covered by the 1950 family-income question.'
      wages_or_salary_self: 'Money the person earned as an employee during 1949. Asked on designated 1950 sample lines.'
      war_fought: 'The war or expedition associated with the veteran’s reported military service.'
      weeks_seeking_work: 'Weeks the person had been looking for work, as recorded in the 1950 supplemental questions.'
      weeks_worked: 'The number of weeks the person worked in 1949, as recorded in the 1950 supplemental questions.'
      worked_last_week: 'Whether the person did any work during the 1950 employment reference week.'
      worked_yesterday: 'Whether the person worked on the previous day or last regular working day, as recorded on the 1930 schedule.'
      worker_class: 'The person’s employment arrangement, such as working for wages, running their own business, or working without pay in a family business. Two people with the same occupation can have different worker classes.'
      worker_class_code: 'A code for the person’s employment arrangement, such as wage work or self-employment, under the year’s classification scheme.'
      year_naturalized: 'The year in which the person became a naturalized U.S. citizen, when reported on the 1920 schedule.'
      year_of_misfortune: 'A year associated with a condition or event in the schedule’s historical misfortune category, when an entry was recorded.'
      years_in_us: 'The number of years a foreign-born person had lived in the United States, as reported in 1900.'
      years_married: 'The number of years the person had been in the marriage the schedule asked about.'
    1850:
      home_value: 'The reported dollar value of real estate owned by the person, which could include property beyond the home they lived in.'
    1860:
      home_value: 'The reported dollar value of real estate owned by the person, which could include property beyond the home they lived in.'
    1870:
      home_value: 'The reported dollar value of real estate owned by the person, which could include property beyond the home they lived in.'
    1880:
      birth_month: 'The month of birth for a child born within the census year, which ran from June 1, 1879, to May 31, 1880.'
    1900:
      attended_school: 'Months of school attendance during the year ending June 1, 1900. Enumerators entered 0 for school-age people who did not attend and left the field blank when the question did not apply.'
      birth_month: 'The person’s month of birth. The 1900 census asked for both month and year of birth as well as age.'
      unemployed_months: 'The number of months the person was out of work during the year ending May 31, 1900, for people to whom the occupation question applied.'
    1910:
      age: 'Age on April 15, 1910. Enumerators recorded completed months for children under two, including cases recorded in both years and months. Each person contributes once to the age summary.'
      attended_school: 'Whether the person attended a school, college, or other educational institution at any time since September 1, 1909. A no answer was requested for non-attendees age 5 through 21.'
    1930:
      home_value: 'The value of an owned home or the monthly rent paid for a rented home. Use the ownership or rental filter when comparing amounts.'
    1940:
      home_value: 'The value of an owned home or the monthly rent for a rented home. These represent different measures and can be separated with the ownership or rental filter.'
    1950:
      age: 'Age in completed years at the census reference date. For infants under one year old, the schedule asked for birth month separately.'
      birth_month: 'The month of birth for an infant under one year old. The general population schedule asked for this in place of an age in completed years.'
      pob_father: 'The state, territory, or country of birth reported for the person’s father. Asked on designated 1950 sample lines.'
      pob_mother: 'The state, territory, or country of birth reported for the person’s mother. Asked on designated 1950 sample lines.'
      years_married: 'The number of years since the most recent marriage, widowhood, divorce, or separation, as applicable. Asked on the last 1950 sample line.'
